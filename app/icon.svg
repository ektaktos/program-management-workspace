<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="circ">
      <circle cx="32" cy="32" r="32"/>
    </clipPath>
    <clipPath id="dark-half">
      <polygon points="0,0 64,64 0,64"/>
    </clipPath>
    <clipPath id="light-half">
      <polygon points="0,0 64,0 64,64"/>
    </clipPath>
  </defs>

  <!-- Sand base -->
  <circle cx="32" cy="32" r="32" fill="#e4d2b4"/>

  <!-- Dark brown bottom-left triangle -->
  <polygon points="0,0 64,64 0,64" fill="#5f441c" clip-path="url(#circ)"/>

  <!-- O: cream where dark, brown where light -->
  <text x="23" y="41" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="400" fill="#faf7f3" text-anchor="middle" clip-path="url(#circ)">O</text>
  <text x="23" y="41" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="400" fill="#5f441c" text-anchor="middle" clip-path="url(#light-half)">O</text>

  <!-- T: brown where light, cream where dark -->
  <text x="41" y="41" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="400" fill="#5f441c" text-anchor="middle" clip-path="url(#circ)">T</text>
  <text x="41" y="41" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="400" fill="#faf7f3" text-anchor="middle" clip-path="url(#dark-half)">T</text>
</svg>
